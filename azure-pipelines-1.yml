# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  name: Neolude-Pool
  vmImage: windows-latest

variables:
  SUBSCRIPTION_ID: 'c84ab836-320a-4451-8302-864ca7447aab'
  LOCATION: 'brazilsouth'
  SERVICE_PRINCIPAL_CONNECTION: 'Azure for Students(c84ab836-320a-4451-8302-864ca7447aab)'
  RESOURCE_GROUP_NAME: 'Neolude-Inspand-Pipeline'

steps:
- task: AzureResourceManagerTemplateDeployment@3
  inputs:
    deploymentScope: 'Subscription'
    azureResourceManagerConnection: $(SERVICE_PRINCIPAL_CONNECTION)
    subscriptionId: $(SUBSCRIPTION_ID)
    location: $(LOCATION)
    templateLocation: 'Linked artifact'
    csmFile: '.\bicep\resourceGroup.bicep'
    overrideParameters: -resourceGroupName $(RESOURCE_GROUP_NAME) -resourceGroupLocation $(LOCATION)
    deploymentMode: 'Incremental'
- task: AzureResourceManagerTemplateDeployment@3
  inputs:
    deploymentScope: 'Resource Group'
    azureResourceManagerConnection: $(SERVICE_PRINCIPAL_CONNECTION)
    subscriptionId: $(SUBSCRIPTION_ID)
    resourceGroupName: $(RESOURCE_GROUP_NAME)
    location: $(LOCATION)
    action: 'Create Or Update Resource Group'
    templateLocation: 'Linked artifact'
    csmFile: '.\bicep\azureDataFactory.bicep'
    deploymentMode: 'Complete'

# - task: AzureCLI@2
#   inputs:
#     azureSubscription: $(SERVICE_PRINCIPAL_CONNECTION)
#     scriptType: 'ps'
#     scriptLocation: 'inlineScript'
#     inlineScript: 'az datafactory trigger delete --factory-name "datafactoryb2v42c6lrdhxs" --resource-group "Lab-Neolude-BI" --name "adf-pipeline-trigger" --yes'
- task: AzureCLI@2
  inputs:
    azureSubscription: 'azure-devops-service-connection'
    scriptType: 'ps'
    scriptLocation: 'inlineScript'
    inlineScript: |
      'az datafactory trigger create 
        --factory-name "datafactoryb2v42c6lrdhxs" 
        --resource-group "Lab-Neolude-BI" 
        --properties ".\bicep\scheduleTrigger.json"
        --name "adf-pipeline-trigger"'

trigger: none
parameters:
  - name: 'customer'
    displayName: 'Nome do cliente para o qual serão criados os recursos'
    type: string
    default: 'neolude'
  - name: 'sqlServerAdminLogin'
    displayName: 'SQL server admin user name'
    type: string
    default: 'neoludeadmin'
  - name: 'sqlServerAdminPassword'
    displayName: 'SQL server admin password'
    type: string
    default: '#Inspand2024'
  - name: 'baseURL'
    displayName: 'API URL'
    default: 'https://jsonplaceholder.typicode.com'
    type: string    
  - name: 'apiSecureString'
    displayName: 'API token'
    default: ';aljdsfjas;ldjf;lksajd;fjasdjf'
  - name: 'relativeURL'
    displayName: 'URL relativa eg: path https://<domínio>/<relative url>'
    type: string
    default: '/users'
  - name: 'environment'
    displayName: 'Ambiente de desenvolvimento ex: dev, stg, prod'
    type: string
    default: 'stg'
  - name: 'department'
    displayName: 'Departamento responsável'
    type: string
    default: 'bi'

variables:
  location: 'brazilsouth'
  resourceGroupName: '${{ parameters.customer }}-${{ parameters.department }}-${{ parameters.environment }}-rg'
  subscriptionId: 'c56f173d-86ef-45e2-9a11-d3d887738b21'
  servicePrincipalConnection: 'AzureDevOpsPipelines'
  agentPool: 'Azure Pipelines'

stages:
  - stage: 'CreateResources'
    displayName: 'Create Azure Data Factory Resources'
    pool: 
      name: $(agentPool)
      vmImage: windows-latest
    jobs:
      - job: 'CreateResourceGroup'
        steps:
          - task: AzureResourceManagerTemplateDeployment@3
            inputs:
              deploymentScope: 'Subscription'
              azureResourceManagerConnection: $(servicePrincipalConnection)
              subscriptionId: $(subscriptionId)
              location: $(location)
              templateLocation: 'Linked artifact'
              csmFile: '.\bicep\resourceGroup.bicep'
              overrideParameters: '-resourceGroupName $(resourceGroupName) -resourceGroupLocation $(location)'
              deploymentMode: 'Incremental'

      - job: 'CreateAzureDataFactory'
        dependsOn: 'CreateResourceGroup'
        condition: succeeded()
        steps:
          - task: AzureResourceManagerTemplateDeployment@3
            inputs:
              deploymentScope: 'Resource Group'
              azureResourceManagerConnection: $(servicePrincipalConnection)
              subscriptionId: $(subscriptionId)
              resourceGroupName: $(resourceGroupName)
              location: $(location)
              action: 'Create Or Update Resource Group'
              templateLocation: 'Linked artifact'
              csmFile: '.\bicep\azureDataFactory.bicep'
              overrideParameters: '-customer ${{ parameters.customer }} -environment ${{ parameters.environment }} -department ${{ parameters.department}}'
              deploymentMode: 'Incremental'
              
      - job: 'CreateSQLDatabase'
        dependsOn: 'CreateResourceGroup'
        condition: succeeded()
        steps:
          - task: AzureResourceManagerTemplateDeployment@3
            inputs:
              deploymentScope: 'Resource Group'
              azureResourceManagerConnection: $(servicePrincipalConnection)
              subscriptionId: $(subscriptionId)
              resourceGroupName: $(resourceGroupName)
              location: $(location)
              action: 'Create Or Update Resource Group'
              templateLocation: 'Linked artifact'
              csmFile: '.\bicep\sqlServer.bicep'
              overrideParameters: '-customer ${{ parameters.customer }} -environment ${{ parameters.environment }} -department ${{ parameters.department}} -sqlServerAdminLogin ${{ parameters.sqlServerAdminLogin }} -sqlServerAdminPassword ${{ parameters.sqlServerAdminPassword }} -customer ${{ parameters.customer }}'
              deploymentMode: 'Incremental'
                
      - job: 'CreateAzureDataFactoryLinkedServices'
        dependsOn: ['CreateSQLDatabase', 'CreateAzureDataFactory']
        condition: succeeded()
        steps:
          - task: AzureResourceManagerTemplateDeployment@3
            inputs:
              deploymentScope: 'Resource Group'
              azureResourceManagerConnection: $(servicePrincipalConnection)
              subscriptionId: $(subscriptionId)
              resourceGroupName: $(resourceGroupName)
              location: $(location)
              action: 'Create Or Update Resource Group'
              templateLocation: 'Linked artifact'
              csmFile: '.\bicep\azureDataFactoryLinkedServices.bicep'
              overrideParameters: '-customer ${{ parameters.customer }} -environment ${{ parameters.environment }} -department ${{ parameters.department}} -sqlServerAdminLogin ${{ parameters.sqlServerAdminLogin }} -sqlServerAdminPassword ${{ parameters.sqlServerAdminPassword }} -baseURL ${{ parameters.baseURL }} -apiSecureString ${{ parameters.apiSecureString }} -customer ${{ parameters.customer }}'
              deploymentMode: 'Incremental'

      - job: 'CreateAzureDataFactoryDataSets'
        dependsOn: 'CreateAzureDataFactoryLinkedServices'
        condition: succeeded()
        steps:
          - task: AzureResourceManagerTemplateDeployment@3
            inputs:
              deploymentScope: 'Resource Group'
              azureResourceManagerConnection: '$(servicePrincipalConnection)'
              subscriptionId: '$(subscriptionId)'
              resourceGroupName: '$(resourceGroupName)'
              location: '$(location)'
              action: 'Create Or Update Resource Group'
              templateLocation: 'Linked artifact'
              csmFile: '.\bicep\azureDataFactoryDataSets.bicep'
              overrideParameters: '-customer ${{ parameters.customer }} -environment ${{ parameters.environment }} -department ${{ parameters.department}} -relativeURL ${{ parameters.relativeURL}}'
              deploymentMode: 'Incremental'              

      - job: 'CreateAzureDataFactoryPipeline'
        dependsOn: 'CreateAzureDataFactoryDataSets'
        condition: succeeded()
        steps:
          - task: AzureResourceManagerTemplateDeployment@3
            inputs:
              deploymentScope: 'Resource Group'
              azureResourceManagerConnection: '$(servicePrincipalConnection)'
              subscriptionId: '$(subscriptionId)'
              resourceGroupName: '$(resourceGroupName)'
              location: '$(location)'
              action: 'Create Or Update Resource Group'
              templateLocation: 'Linked artifact'
              csmFile: '.\bicep\azureDataFactoryPipeline.bicep'
              overrideParameters: '-customer ${{ parameters.customer }} -environment ${{ parameters.environment }} -department ${{ parameters.department}}'
              deploymentMode: 'Incremental'              
  
  - stage: 'CreateTablesOnDatabase'
    displayName: 'Create schemas and tables on sql database'
    dependsOn: 'CreateResources'
    condition: succeeded()
    pool:
      name: $(agentPool)
      vmImage: windows-latest
    jobs:
      - job: 'CreateSchemasAndTablesOnDatabase'
        steps:
          - task: UseDotNet@2
            inputs:
              version: '8.x'
              performMultiLevelLookup: true
          - task: DotNetCoreCLI@2
            inputs:
              command: 'run'
              projects: '.\dotnet-scripts\dotnet-scripts.csproj'
              arguments: '${{ parameters.customer }}-${{ parameters.department }}-${{ parameters.environment }}-sqlsvr ${{ parameters.customer }}-${{ parameters.department }}-${{ parameters.environment }}-sqldb ${{ parameters.sqlServerAdminLogin }} ${{ parameters.sqlServerAdminPassword }}' 
              workingDirectory: '.\dotnet-scripts'

  - stage: 'DevelopmentPipeline'
    displayName: 'Start Dev Azure Data Factory Pipeline'
    condition: ${{ eq(parameters.environment, 'dev') }}
    pool:
      name: '$(agentPool)'
      vmImage: 'windows-latest'
    jobs:
      - job: 'CreateAzureDataFactoryTrigger'
        steps:
          - task: AzureResourceManagerTemplateDeployment@3
            inputs:
              deploymentScope: 'Resource Group'
              azureResourceManagerConnection: '$(servicePrincipalConnection)'
              subscriptionId: '$(subscriptionId)'
              resourceGroupName: '$(resourceGroupName)'
              location: '$(location)'
              action: 'Create Or Update Resource Group'
              templateLocation: 'Linked artifact'
              csmFile: '.\bicep\azureDataFactoryTrigger.bicep'
              overrideParameters: '-customer ${{ parameters.customer }} -environment ${{ parameters.environment }} -department ${{ parameters.department}}'
              deploymentMode: 'Incremental'
          - task: AzurePowerShell@5
            inputs:
              azureSubscription: '$(servicePrincipalConnection)'
              azurePowerShellVersion: latestVersion
              ScriptType: 'FilePath'
              ScriptPath: '.\ps-scripts\start-trigger.ps1'
              ScriptArguments: '$(resourceGroupName) ${{ parameters.department}} ${{ parameters.environment}} ${{ parameters.customer }}'

  - stage: 'StagingPipeline'
    displayName: 'Start Stg Azure Data Factory Pipeline'
    condition: ${{ eq(parameters.environment, 'stg') }}
    pool:
      name: '$(agentPool)'
      vmImage: 'windows-latest'
    jobs:
      - job: 'CreateAzureDataFactoryTrigger'
        steps:
          - task: AzureResourceManagerTemplateDeployment@3
            inputs:
              deploymentScope: 'Resource Group'
              azureResourceManagerConnection: '$(servicePrincipalConnection)'
              subscriptionId: '$(subscriptionId)'
              resourceGroupName: '$(resourceGroupName)'
              location: '$(location)'
              action: 'Create Or Update Resource Group'
              templateLocation: 'Linked artifact'
              csmFile: '.\bicep\azureDataFactoryTrigger.bicep'
              overrideParameters: '-customer ${{ parameters.customer }} -environment ${{ parameters.environment }} -department ${{ parameters.department}}'
              deploymentMode: 'Incremental'
          - task: AzurePowerShell@5
            inputs:
              azureSubscription: '$(servicePrincipalConnection)'
              azurePowerShellVersion: latestVersion
              ScriptType: 'FilePath'
              ScriptPath: '.\ps-scripts\start-trigger.ps1'
              ScriptArguments: '$(resourceGroupName) ${{ parameters.department}} ${{ parameters.environment}} ${{ parameters.customer }}'

  - stage: 'ProductionPipeline'
    displayName: 'Start Prod Azure Data Factory Pipeline'
    condition: ${{ eq(parameters.environment, 'prod') }}
    pool:
      name: $(agentPool)
      vmImage: 'windows-latest'
    jobs:
      - job: 'CreateAzureDataFactoryTrigger'
        steps:
          - task: AzureResourceManagerTemplateDeployment@3
            inputs:
              deploymentScope: 'Resource Group'
              azureResourceManagerConnection: '$(servicePrincipalConnection)'
              subscriptionId: '$(subscriptionId)'
              resourceGroupName: '$(resourceGroupName)'
              location: '$(location)'
              action: 'Create Or Update Resource Group'
              templateLocation: 'Linked artifact'
              csmFile: '.\bicep\azureDataFactoryTrigger.bicep'
              overrideParameters: '-environment ${{ parameters.environment }} -department ${{ parameters.department}}'
              deploymentMode: 'Incremental'              
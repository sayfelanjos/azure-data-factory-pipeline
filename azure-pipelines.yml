# https://aka.ms/yaml

trigger:
- main

name: 'Deploy Neolude Pipelines'

pool:
  vmImage: ubuntu-latest

pool: 
  name: Neolude-Pool
  vmImage: windows-latest
  
steps:
  - task: AzureResourceManagerTemplateDeployment@3
    inputs:
      deploymentScope: 'Resource Group'
      azureResourceManagerConnection: azure-devops-service-connection
      subscriptionId: 'c84ab836-320a-4451-8302-864ca7447aab'
      action: 'Create Or Update Resource Group'
      resourceGroupName: 'Lab-Neolude-BI'
      location: 'Brazil South'
      templateLocation: 'Linked artifact'
      csmFile: '.\bicep\resourceGroup.bicep'
      deploymentMode: 'Complete'


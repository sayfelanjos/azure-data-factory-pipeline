# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

name: 'Deploy Neolude Pipelines'

pool:
  vmImage: ubuntu-latest

pool: 
  name: Neolude-Pool
  vmImage: windows-latest
  
steps:
  - task: AzureResourceManagerTemplateDeployment@3
    inputs:
      deploymentScope: 'Subscription'
      azureResourceManagerConnection: $(azureServiceConnection)
      subscriptionId: 'c84ab836-320a-4451-8302-864ca7447aab'
      location: $(location)
      templateLocation: 'Linked artifact'
      csmFile: .\bicep\resourceGroup.bicep
      csmParametersFile: .\bicep\reourceGroupParam.bicepparam
      deploymentMode: 'Incremental'
      deploymentName: 'DeployResourceGroupOnAzureDevops'


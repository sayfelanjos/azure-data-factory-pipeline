trigger: none
parameters:
  - name: 'customer'
    displayName: 'Nome do cliente para o qual serão criados os recursos'
    type: string
    default: 'casas-bahia'
  - name: 'baseURL'
    displayName: 'API URL'
    default: 'https://data-api.neolude.com.br'
    type: string
  - name: 'environment'
    displayName: 'Ambiente de desenvolvimento ex: dev, stg, prod'
    type: string
    default: 'dev'
  - name: 'department'
    displayName: 'Departamento responsável'
    type: string
    default: 'bi'

variables:
  location: 'brazilsouth'
  prefix: '${{ parameters.customer }}-${{ parameters.department }}-${{ parameters.environment }}'
  resourceGroupName: '$(prefix)-rg'
  dataFactoryName: '$(prefix)-adf'
  serverName: '$(prefix)-sqlsvr'
  dbName: '$(prefix)-sqldb'
  subscriptionId: 'c56f173d-86ef-45e2-9a11-d3d887738b21'
  servicePrincipalConnection: 'AzureDevOpsPipelines'
  agentPool: 'Azure Pipelines'

stages:
  - stage: 'CreateResourceGroup'
    displayName: 'Create Resource Group'
    pool: 
      name: $(agentPool)
      vmImage: windows-latest
    jobs:
      - job: 'CreateResourceGroup'
        steps:
          - task: AzureResourceManagerTemplateDeployment@3
            inputs:
              deploymentScope: 'Subscription'
              azureResourceManagerConnection: $(servicePrincipalConnection)
              subscriptionId: $(subscriptionId)
              location: $(location)
              templateLocation: 'Linked artifact'
              csmFile: '.\bicep\resourceGroup\resourceGroup.bicep'
              overrideParameters: '-resourceGroupName $(resourceGroupName) -resourceGroupLocation $(location)'
              deploymentMode: 'Incremental'

  - stage: 'CreateSqlDatabase'
    displayName: 'Create SQL Database'
    dependsOn: 'CreateResourceGroup'
    condition: succeeded()
    pool:
      name: $(agentPool)
      vmImage: windows-latest
    jobs:
      - job: 'CreateSQLDatabase'
        steps:
          - task: AzurePowerShell@5
            inputs:
              azureSubscription: '$(servicePrincipalConnection)'
              azurePowerShellVersion: latestVersion
              ScriptType: 'FilePath'
              ScriptPath: '.\ps-scripts\sql-server-deployment.ps1'
              ScriptArguments: '$(resourceGroupName) $(serverName) $(dbName) $(adminLogin) $(adminPassword)'         
      - job: 'CreateSchemasAndTablesOnDatabase'
        dependsOn: 'CreateSQLDatabase'
        condition: succeeded()
        steps:
          - task: UseDotNet@2
            inputs:
              version: '8.x'
              performMultiLevelLookup: true
          - task: DotNetCoreCLI@2
            inputs:
              command: 'run'
              projects: '.\dotnet-scripts\dotnet-scripts.csproj'
              arguments: '$(serverName) $(dbName) $(adminLogin) $(adminPassword)' 
              workingDirectory: '.\dotnet-scripts'

  - stage: 'CreateAzureDataFactory'
    dependsOn: ['CreateResourceGroup', 'CreateSqlDatabase']
    displayName: 'Create Azure Data Factory'
    pool: 
      name: $(agentPool)
      vmImage: windows-latest
    jobs:
      - job: 'CreateAzureDataFactory'
        steps:
          - task: AzureResourceManagerTemplateDeployment@3
            inputs:
              deploymentScope: 'Resource Group'
              azureResourceManagerConnection: $(servicePrincipalConnection)
              subscriptionId: $(subscriptionId)
              location: $(location)
              resourceGroupName: $(resourceGroupName)
              action: 'Create Or Update Resource Group'
              templateLocation: 'Linked artifact'
              csmFile: '.\bicep\dataFactory\dataFactory.bicep'
              overrideParameters: '-dataFactoryName $(dataFactoryName)'
              deploymentMode: 'Incremental'
                
      - job: 'CreateLinkedServices'
        dependsOn: ['CreateAzureDataFactory']
        condition: succeeded()
        steps:
          - task: AzureResourceManagerTemplateDeployment@3
            inputs:
              deploymentScope: 'Resource Group'
              azureResourceManagerConnection: $(servicePrincipalConnection)
              subscriptionId: $(subscriptionId)
              resourceGroupName: $(resourceGroupName)
              location: $(location)
              action: 'Create Or Update Resource Group'
              templateLocation: 'Linked artifact'
              csmFile: '.\bicep\linkedServices\linkedServices.bicep'
              overrideParameters: '-dataFactoryName $(dataFactoryName) -serverName $(serverName) -dbName $(dbName) -sqlServerAdminLogin $(adminLogin) -sqlServerAdminPassword $(adminPassword) -baseURL ${{ parameters.baseURL }} -apiSecureString $(apiToken)'
              deploymentMode: 'Incremental'

      - job: 'CreateDataSetsOut'
        dependsOn: ['CreateLinkedServices']
        condition: succeeded()
        steps:
          - task: AzurePowerShell@5
            inputs:
              azureSubscription: '$(servicePrincipalConnection)'
              azurePowerShellVersion: latestVersion
              ScriptType: 'FilePath'
              ScriptPath: '.\ps-scripts\datasets-out-deployment.ps1'
              ScriptArguments: '$(resourceGroupName) $(dataFactoryName)'          

      - job: 'CreateDataSetsIn'
        dependsOn: ['CreateLinkedServices']
        condition: succeeded()
        steps:
          - task: AzurePowerShell@5
            inputs:
              azureSubscription: '$(servicePrincipalConnection)'
              azurePowerShellVersion: latestVersion
              ScriptType: 'FilePath'
              ScriptPath: '.\ps-scripts\datasets-in-deployment.ps1'
              ScriptArguments: '$(resourceGroupName) $(dataFactoryName)'   
                          
      - job: 'CreatePipelines'
        dependsOn: ['CreateDataSetsOut', 'CreateDataSetsIn']
        condition: succeeded()
        steps:
          - task: AzurePowerShell@5
            inputs:
              azureSubscription: '$(servicePrincipalConnection)'
              azurePowerShellVersion: latestVersion
              ScriptType: 'FilePath'
              ScriptPath: '.\ps-scripts\pipelines-deployment.ps1'
              ScriptArguments: '$(resourceGroupName) $(dataFactoryName)'  

  - stage: 'StartingAzureDataFactoryPipeline'
    displayName: 'Start Azure Data Factory Pipeline'
    dependsOn: ['CreateResourceGroup', 'CreateAzureDataFactory', 'CreateSqlDatabase']
    pool:
      name: '$(agentPool)'
      vmImage: 'windows-latest'
    jobs:
      - job: 'CreateTrigger'
        steps:
          - task: AzurePowerShell@5
            inputs:
              azureSubscription: '$(servicePrincipalConnection)'
              azurePowerShellVersion: latestVersion
              ScriptType: 'FilePath'
              ScriptPath: '.\ps-scripts\triggers-deployment.ps1'
              ScriptArguments: '$(resourceGroupName) $(dataFactoryName)'
      - job: 'StopTrigger'
        steps:
          - task: PowerShell@2
            inputs:
              targetType: 'inline'
              script: |
                'Start-Sleep -Seconds 150'
          - task: AzurePowerShell@5
            inputs:
              azureSubscription: '$(servicePrincipalConnection)'
              azurePowerShellVersion: latestVersion
              ScriptType: 'FilePath'
              ScriptPath: '.\ps-scripts\stop-triggers.ps1'
              ScriptArguments: '$(resourceGroupName) $(dataFactoryName)'     

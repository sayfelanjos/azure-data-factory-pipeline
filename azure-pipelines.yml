  - stage: 'CreateTriggerForDailyExecution'
    displayName: 'Start Azure Data Factory Pipeline'
    # dependsOn: StartingAzureDataFactoryPipeline
    pool:
      name: '$(agentPool)'
      vmImage: 'windows-latest'
    jobs:
      - job: 'RebuildPipelines'
        condition: succeeded()
        steps:
          - task: AzurePowerShell@5
            inputs:
              azureSubscription: '$(servicePrincipalConnection)'
              azurePowerShellVersion: latestVersion
              ScriptType: 'FilePath'
              ScriptPath: '$(Build.SourcesDirectory)\ps-scripts\pipelines-deployment.ps1'
              ScriptArguments: '$(resourceGroupName) $(dataFactoryName) "$(updateStartDateDaily)"'  
      - job: 'CreateTrigger'
        dependsOn: 'RebuildPipelines'
        condition: succeeded()
        steps:
          - task: AzurePowerShell@5
            inputs:
              azureSubscription: '$(servicePrincipalConnection)'
              azurePowerShellVersion: latestVersion
              ScriptType: 'FilePath'
              ScriptPath: '$(Build.SourcesDirectory)\ps-scripts\trigger-deployment.ps1'
              ScriptArguments: '$(resourceGroupName) $(dataFactoryName) $(updateStartDateDaily)'  
      - job: 'StartTrigger'
        dependsOn: 'CreateTrigger'
        condition: succeeded()
        steps:
          - task: AzurePowerShell@5
            inputs:
              azureSubscription: '$(servicePrincipalConnection)'
              azurePowerShellVersion: latestVersion
              ScriptType: 'FilePath'
              ScriptPath: '$(Build.SourcesDirectory)\ps-scripts\start-trigger.ps1'
              ScriptArguments: '$(resourceGroupName) $(dataFactoryName) $(updateStartDateDaily)'  